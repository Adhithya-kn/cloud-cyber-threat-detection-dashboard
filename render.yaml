services:
  - type: web
    name: cybershield-soc-dashboard
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "./entrypoint.sh"
    plan: free
    healthCheckPath: "/_stcore/health"
    envVars:
      - key: PORT
        value: 10000
      - key: APP_MODE
        value: dashboard
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.8

  - type: web
    name: cybershield-ingestion-api
    env: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python3 -m uvicorn api:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: "/healthz"
    envVars:
      - key: PORT
        value: 8000
      - key: APP_MODE
        value: api
      - key: ENV
        value: production
