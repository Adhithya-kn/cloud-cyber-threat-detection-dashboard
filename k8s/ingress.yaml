apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybershield-ingress
  namespace: cybershield-soc
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "cybershield-service"
spec:
  rules:
    - host: cybershield.cloud.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybershield-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cybershield-service
                port:
                  number: 8000
